function copyToClipboard(text) {
  if (navigator.clipboard?.writeText) {
    return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  const el = document.createElement("textarea");
  el.value = text;
  el.style.cssText = "position:fixed;top:-9999px;left:-9999px;opacity:0;pointer-events:none";
  document.body.appendChild(el);
  el.focus();
  el.select();
  el.setSelectionRange(0, text.length);
  try { document.execCommand("copy"); } catch (_) {}
  document.body.removeChild(el);
}

function buildApiConfigBlock(cfg) {
  const ac = cfg.apiConfig;
  if (!ac?.baseUrl) return "";
  const fields = (ac.authFields||[]).filter(f=>f.key);
  const extraEndpoints = (ac.extraEndpoints||[]).filter(e=>e.path);
  const headers = (ac.customHeaders||[]).filter(h=>h.key);
  return `
━━━ YOUR API CONFIGURATION (wire these exactly) ━━━
Base URL:       ${ac.baseUrl}${ac.apiVersion||""}
Content-Type:   application/json
Auth Header:    ${ac.authHeaderFormat||"Bearer {token}"}
${headers.length?`Custom Headers:\n${headers.map(h=>`  ${h.key}: ${h.value||""}`).join("\n")}`:""}

AUTH ENDPOINT:
  Method:   ${ac.authMethod||"POST"}
  Path:     ${ac.authEndpoint||"/auth/login"}
  Full URL: ${ac.baseUrl}${ac.apiVersion||""}${ac.authEndpoint||"/auth/login"}
${fields.length?`  Request Body:\n${fields.map(f=>`    ${f.key}: ${f.type||"String"}${f.required?" (required)":""}`).join("\n")}`:"  Request Body: { as defined by your backend }"}
  Response:

function buildCombinedPrompt(cfg, prompts) {
  const fw = cfg.framework||"Framework";
  const sm = cfg.stateManagement||"State Management";
  const industry = cfg.industry||"General";
  const uiType = cfg.uiType||"Minimal & Clean";
  const apiBlock = buildApiConfigBlock(cfg);

  const header = `╔══════════════════════════════════════════════════════════════╗
║         PROMPTFORGE — COMPLETE PROJECT SPECIFICATION          ║
╚══════════════════════════════════════════════════════════════╝

PROJECT TYPE:  ${industry} ${cfg.platform||"App"}
STACK:         ${fw} + ${sm} + ${cfg.architecture||"Clean Architecture"}
UI SYSTEM:     ${cfg.uiDesign||"Material Design 3"} — ${uiType}
THEME:         ${cfg.theme||"Light + Dark"}
BACKEND:       ${(cfg.backendServices||[]).join(", ")||"Custom"}
DATABASES:     ${(cfg.databases||[]).join(", ")||"As needed"}
INTEGRATIONS:  ${[cfg.pushProvider,cfg.dynamicLink,cfg.analytics,cfg.crashTool].filter(Boolean).join(" · ")||"As needed"}
${apiBlock?`\n${apiBlock}`:""}
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
INSTRUCTIONS FOR AI:
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
1. Read this ENTIRE specification before writing a single line of code
2. Create a PLAN with phases before starting implementation
3. Implement each PHASE completely before moving to the next
4. After each phase, validate against the rules before proceeding
5. DO NOT create feature modules — only foundation, integrations, and base systems
6. Feature modules will be added one by one after setup is complete

━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`;

  const phases = {};
  prompts.forEach(p => {
    const ph = p.phase||"Phase 5";
    if (!phases[ph]) phases[ph] = [];
    phases[ph].push(p);
  });

  const body = Object.entries(phases).map(([phase, ps]) => {
    const divider = `\n${"═".repeat(62)}\n${phase.toUpperCase()} — ${ps.map(p=>p.title).join(" + ")}\n${"═".repeat(62)}\n`;
    return divider + ps.map(p => `\n── STEP ${p.id}: ${p.title.toUpperCase()} ──\n\n${p.prompt}`).join("\n\n");
  }).join("\n\n");

  const footer = `

${"━".repeat(62)}
END OF PROJECT SPECIFICATION
${"━".width}
After completing all phases above:
• Review all generated project-rules/ files
• Test all base systems work correctly  
• Run QA validation before creating any feature modules
• Create features one at a time using: templates/feature-template.md
  Prompt: "Create [FeatureName] Module. Follow project-rules/master-rules.md"
${"━".repeat(62)}`;

  return header + "\n" + body + footer;
}

  .pf-term-body::-webkit-scrollbar-track{background:#12121f;}

  .pf-summary{background:linear-gradient(135deg,#1e1b4b,#312e81);border-radius:14px;padding:18px;margin-bottom:18px;border:1px solid rgba(99,102,241,.3);}
  .pf-tag{display:inline-flex;background:rgba(255,255,255,.1);color:#c7d2fe;font-size:11px;padding:2px 9px;border-radius:100px;font-weight:500;margin:2px;}
  .pf-combined-btn{padding:11px 20px;border-radius:9px;border:1.5px solid rgba(99,102,241,.4);background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(139,92,246,.05));color:#6366f1;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;font-family:inherit;transition:all .13s;width:100%;margin-bottom:12px;justify-content:center;}
  .pf-combined-btn:hover{border-color:#6366f1;background:linear-gradient(135deg,rgba(99,102,241,.15),rgba(139,92,246,.08));}
  .pf-combined-btn.copied{border-color:#059669;background:rgba(5,150,105,.08);color:#059669;}
  button:hover:not(:disabled){opacity:.9;}
`;

const STEP_LABELS=["Platform","Framework","State","Architecture","API Config","Design","Backend","Integrations","Features","Workflow"];
const TAG_STYLES={FOUNDATION:{bg:"#eef2ff",color:"#4338ca",border:"#c7d2fe"},INTEGRATION:{bg:"#fdf4ff",color:"#7e22ce",border:"#e9d5ff"},CORE:{bg:"#ecfeff",color:"#0e7490",border:"#a5f3fc"},TEMPLATE:{bg:"#eff6ff",color:"#1d4ed8",border:"#bfdbfe"},VALIDATION:{bg:"#fffbeb",color:"#b45309",border:"#fde68a"},DEVOPS:{bg:"#f0fdf4",color:"#15803d",border:"#bbf7d0"},OPTIMIZATION:{bg:"#fff1f2",color:"#be123c",border:"#fecdd3"}};

/* ══════════════ SUB-COMPONENTS ══════════════ */
function RecTag({label="RECOMMENDED"}){return(<div className="pf-rec-tag"><i className="ti ti-star-filled" style={{fontSize:8}}/>{label}</div>);}

function OptCard({id,label,desc,icon,emoji,active,onClick,recommended,recReason,multi,recLabel}){
  return(
    <div style={{position:"relative",marginTop:recommended?11:0}}>
      {recommended&&<RecTag label={recLabel}/>}
      <button className={`pf-opt${active?" selected":""}${recommended&&!active?" rec-glow":""}`} onClick={onClick}>
        {(icon||emoji)&&<div className="pf-opt-icon">{icon?<i className={`ti ${icon}`} style={{fontSize:16,color:active?"#fff":"var(--color-text-secondary)"}}/>:emoji}</div>}
        {!icon&&!emoji&&<div className="pf-check">{active&&<i className="ti ti-check" style={{fontSize:11,color:"#fff"}}/>}</div>}
        <div className="pf-opt-body">
          <div className="pf-opt-name">{label||id}</div>
          {desc&&<div className="pf-opt-desc">{desc}</div>}
          {recommended&&recReason&&<div className="pf-rec-reason"><i className="ti ti-shield-check-filled" style={{fontSize:10}}/>{recReason}</div>}
        </div>
        {!multi&&!icon&&!emoji&&<div className="pf-check">{active&&<i className="ti ti-check" style={{fontSize:11,color:"#fff"}}/>}</div>}
        {multi&&(icon||emoji)&&<div className="pf-check">{active&&<i className="ti ti-check" style={{fontSize:11,color:"#fff"}}/>}</div>}
      </button>
    </div>
  );
}

function SH({children}){return <div className="pf-section-title">{children}</div>;}

function InfoBox({children,type=""}){return <div className={`pf-info ${type}`}>{children}</div>;}

function FieldsEditor({fields,onChange,placeholder="key",typePlaceholder="type"}){
  const add=()=>onChange([...fields,{key:"",type:"String",required:true}]);
  const remove=(i)=>onChange(fields.filter((_,j)=>j!==i));
  const upd=(i,k,v)=>onChange(fields.map((f,j)=>j===i?{...f,[k]:v}:f));
  return(
    <div>
      {fields.map((f,i)=>(
        <div className="pf-field-row" key={i}>
          <input className="pf-input" value={f.key} placeholder={placeholder} onChange={e=>upd(i,"key",e.target.value)} style={{fontSize:12}}/>
          <select className="pf-select" value={f.type||"String"} onChange={e=>upd(i,"type",e.target.value)} style={{fontSize:12,padding:"9px 8px"}}>
            {PARAM_TYPES.map(t=><option key={t}>{t}</option>)}
          </select>
          <button className="pf-icon-btn" onClick={()=>remove(i)} title="Remove"><i className="ti ti-x" style={{fontSize:12}}/></button>
        </div>
      ))}
      <button className="pf-add-btn" onClick={add}><i className="ti ti-plus" style={{fontSize:11}}/> Add {placeholder}</button>
    </div>
  );
}

function EndpointsEditor({endpoints,onChange}){
  const add=()=>onChange([...endpoints,{method:"GET",path:"",name:"",desc:""}]);
  const remove=(i)=>onChange(endpoints.filter((_,j)=>j!==i));
  const upd=(i,k,v)=>onChange(endpoints.map((f,j)=>j===i?{...f,[k]:v}:f));
  return(
    <div>
      {endpoints.map((e,i)=>(
        <div key={i} style={{marginBottom:10,background:"var(--color-background-secondary)",borderRadius:10,padding:"10px 12px",border:"1px solid var(--color-border-tertiary)"}}>
          <div className="pf-field-row-4" style={{marginBottom:6}}>
            <select className="pf-select" value={e.method} onChange={ev=>upd(i,"method",ev.target.value)} style={{fontSize:11,padding:"7px 6px"}}>
              {HTTP_METHODS.map(m=><option key={m}>{m}</option>)}
            </select>
            <input className="pf-input" value={e.path} placeholder="/resource/:id" onChange={ev=>upd(i,"path",ev.target.value)} style={{fontSize:12}}/>
            <input className="pf-input" value={e.name} placeholder="Name" onChange={ev=>upd(i,"name",ev.target.value)} style={{fontSize:12}}/>
            <button className="pf-icon-btn" onClick={()=>remove(i)}><i className="ti ti-x" style={{fontSize:12}}/></button>
          </div>
          <input className="pf-input" value={e.desc} placeholder="Brief description (optional)" onChange={ev=>upd(i,"desc",ev.target.value)} style={{fontSize:11}}/>
        </div>
      ))}
      <button className="pf-add-btn" onClick={add}><i className="ti ti-plus" style={{fontSize:11}}/> Add Endpoint</button>
    </div>
  );
}

/* ══════════════ MAIN APP ══════════════ */
function App(){
  const [step,setStep]=useState(0);
  const [cfg,setCfg]=useState({apiConfig:{authFields:[{key:"email",type:"String",required:true},{key:"password",type:"String",required:true}],customHeaders:[],extraEndpoints:[],authMethod:"POST",authEndpoint:"/auth/login",apiVersion:"/v1",tokenField:"access_token",userField:"user",authHeaderFormat:"Bearer {token}"}});
  const [prompts,setPrompts]=useState(null);
  const [copied,setCopied]=useState(null);
  const [expanded,setExpanded]=useState(null);
  const [combinedCopied,setCombinedCopied]=useState(false);
  const topRef=useRef(null);

  const set=(k,v)=>setCfg(c=>({...c,[k]:v}));
  const setAC=(k,v)=>setCfg(c=>({...c,apiConfig:{...c.apiConfig,[k]:v}}));
  const toggle=(k,v)=>setCfg(c=>{const a=c[k]||[];return{...c,[k]:a.includes(v)?a.filter(x=>x!==v):[...a,v]};});
  const isRec=(cat,val)=>getSmartRecs(cat,cfg).includes(val);
  const fw=cfg.framework||"";
  const getFL=()=>{if(cfg.platform==="web")return WEB_FW;if(cfg.platform==="desktop")return DESKTOP_FW;if(cfg.platform==="backend")return BACKEND_FW;if(cfg.platform==="mobile"){if(cfg.mobileType==="Cross Platform")return CROSS_FW;if(cfg.mobileType==="Native"&&cfg.mobileOs)return NATIVE_TECH[cfg.mobileOs]||[];}return[];};
  const getSL=()=>STATE_OPTS[fw]||STATE_OPTS.default;
  const getDL=()=>fw==="Flutter"||fw?.includes("Flutter")?DI_MAP.Flutter:["Jetpack Compose","Kotlin","Java"].includes(fw)?DI_MAP.Android:DI_MAP.Web;
  const getRL=()=>ROUTING_MAP[fw]||ROUTING_MAP["React / Next.js"]||ROUTING_MAP.default;
  const isFlutter=fw==="Flutter"||cfg.platform==="mobile";
  const getDBL=()=>DB_OPTS.filter(d=>isFlutter?d.flutter:!d.flutter);

  const canNext=()=>{if(step===0)return!!cfg.platform;if(step===1){if(cfg.platform==="mobile")return!!(cfg.mobileOs&&cfg.mobileType&&cfg.framework);return!!cfg.framework;}if(step===2)return!!cfg.stateManagement;return true;};

  const go=(s)=>{setStep(s);setTimeout(()=>topRef.current?.scrollIntoView({behavior:"smooth"}),10);};

  const generate=()=>{const ps=buildPrompts(cfg);setPrompts(ps);setStep(10);setTimeout(()=>topRef.current?.scrollIntoView({behavior:"smooth"}),50);};

  const handleCopy=useCallback((id,text)=>{
    copyToClipboard(text).then(()=>{setCopied(id);setTimeout(()=>setCopied(null),2500);}).catch(()=>{setCopied(`fail-${id}`);setTimeout(()=>setCopied(null),2500);});
  },[]);

  const handleCombinedCopy=useCallback(()=>{
    if(!prompts)return;
    const combined=buildCombinedPrompt(cfg,prompts);
    copyToClipboard(combined).then(()=>{setCombinedCopied(true);setTimeout(()=>setCombinedCopied(false),3000);}).catch(()=>{});
  },[cfg,prompts]);

  return(
    <>
      <style>{css}</style>
      <div className="pf-root">
        <div ref={topRef}/>
        {/* HERO */}
        <div className="pf-hero">
          <div className="pf-hero-inner">
            <div className="pf-badge"><i className="ti ti-sparkles" style={{fontSize:11}}/> PromptForge — AI Development Prompt Generator</div>
            <h1 className="pf-title">{step===10?`✅ ${prompts?.length} Prompts Generated`:"Build production apps with AI."}</h1>
            <p className="pf-sub">{step===10?`Stack: ${cfg.framework||"—"} · ${cfg.stateManagement||"—"} · ${cfg.industry||"—"}. Execute prompts in order, or copy the single combined prompt.`:"Configure your stack → get expert-crafted, copy-ready AI prompts for Cursor, Windsurf, Antigravity & more."}</p>
          </div>
        </div>

        {/* STEP NAV */}
        {step<10&&(
          <div className="pf-progress">
            <div className="pf-steps">
              {STEP_LABELS.map((label,i)=>{const s=i<step?"done":i===step?"active":"pending";return(
                <div key={i} className={`pf-step-item ${s}`}>
                  <div className="pf-step-num">{i<step?<i className="ti ti-check" style={{fontSize:11}}/>:i+1}</div>
                  <span className="pf-step-label">{label}</span>
                </div>);
              })}
            </div>
          </div>
        )}

        {step>0&&step<10&&(
          <div style={{maxWidth:740,margin:"0 auto",padding:"14px 20px 0"}}>
            <InfoBox type="pf-warn"><i className="ti ti-star-filled" style={{color:"#f59e0b",fontSize:14,flexShrink:0,marginTop:1}}/><span><strong style={{color:"#92400e"}}>⭐ Recommended</strong> = Best choice for industry-standard, long-term, crash-free production apps based on your selected stack.</span></InfoBox>
          </div>
        )}

        <div className="pf-body">

          {/* STEP 0: PLATFORM */}
          {step===0&&(
            <div>
              <SH>Select your platform type</SH>
              <div className="pf-plat-grid">
                {PLATFORMS.map(p=>{const recs=["mobile","web","fullstack"];const isR=recs.includes(p.id);return(
                  <div key={p.id} style={{position:"relative"}}>
                    {isR&&<RecTag label={p.id==="mobile"?"POPULAR":p.id==="web"?"FAST TO SHIP":"FULL CONTROL"}/>}
                    <div className={`pf-plat-card${cfg.platform===p.id?" selected":""}`} onClick={()=>set("platform",p.id)} style={{marginTop:isR?11:0}}>
                      <span className="pf-plat-emoji">{p.icon}</span>
                      <span className="pf-plat-name">{p.label}</span>
                      <span className="pf-plat-sub">{p.sub}</span>
                    </div>
                  </div>);})}
              </div>
            </div>
          )}

          {/* STEP 1: FRAMEWORK */}
          {step===1&&(
            <div>
              {cfg.platform==="mobile"&&(<>
                <SH>Target operating system</SH>
                <div className="pf-pills">{MOBILE_OS.map(o=><button key={o} className={`pf-pill${cfg.mobileOs===o?" selected":""}`} onClick={()=>{set("mobileOs",o);set("framework",null);}}>
                  {o==="Android"?"🤖":o==="iOS"?"🍎":"📱"} {o}
                </button>)}</div>
                <SH>Development approach</SH>
                {MOBILE_TYPES.map(t=><OptCard key={t.id} id={t.id} label={t.id} desc={t.desc} icon={t.icon} active={cfg.mobileType===t.id} recommended={t.id==="Cross Platform"} recReason="One codebase → iOS+Android. 50% less dev time." onClick={()=>{set("mobileType",t.id);set("framework",null);}}/>)}
              </>)}
              {getFL().length>0&&(<>
                <SH>Framework</SH>
                {getFL().map(f=>{const rec=isRec("framework",f.id);return(<OptCard key={f.id} id={f.id} label={f.id} desc={f.desc} icon={f.icon} active={cfg.framework===f.id} recommended={rec} recReason={rec?RECS.framework[f.id]:null} onClick={()=>set("framework",f.id)}/>);})}
              </>)}
            </div>
          )}

          {/* STEP 2: STATE */}
          {step===2&&(<div><SH>State management for {fw||"your framework"}</SH>{getSL().map(s=>{const rec=isRec("stateManagement",s.id);return(<OptCard key={s.id} id={s.id} label={s.id} desc={s.desc} active={cfg.stateManagement===s.id} recommended={rec} recReason={rec?RECS.stateManagement[s.id]:null} onClick={()=>set("stateManagement",s.id)}/>);})}</div>)}

          {/* STEP 3: ARCHITECTURE */}
          {step===3&&(<div>
            <SH>Architecture pattern</SH>
            {ARCH_OPTS.map(a=><OptCard key={a.id} id={a.id} label={a.id} desc={a.desc} active={cfg.architecture===a.id} recommended={isRec("architecture",a.id)} recReason={RECS.architecture[a.id]} onClick={()=>set("architecture",a.id)}/>)}
            <SH>Dependency injection</SH>
            {getDL().map(d=><OptCard key={d.id} id={d.id} label={d.id} desc={d.desc} active={cfg.di===d.id} recommended={isRec("di",d.id)} recReason={RECS.di[d.id]} onClick={()=>set("di",d.id)}/>)}
            <SH>Routing</SH>
            {getRL().map(r=><OptCard key={r.id} id={r.id} label={r.id} desc={r.desc} active={cfg.routing===r.id} recommended={isRec("routing",r.id)} recReason={RECS.routing[r.id]} onClick={()=>set("routing",r.id)}/>)}
            <SH>API protocol</SH>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {API_OPTS.map(a=><OptCard key={a.id} id={a.id} label={a.id} desc={a.desc} active={cfg.api===a.id} recommended={isRec("api",a.id)} recReason={RECS.api[a.id]} onClick={()=>set("api",a.id)}/>)}
            </div>
            <SH>Error handling</SH>
            {ERR_OPTS.map(e=><OptCard key={e.id} id={e.id} label={e.id} desc={e.desc} active={cfg.error===e.id} recommended={isRec("error",e.id)} recReason={RECS.error[e.id]} onClick={()=>set("error",e.id)}/>)}
          </div>)}

          {/* STEP 4: API CONFIG — OPTIONAL */}
          {step===4&&(
            <div>
              <div className="pf-optional-banner">
                <i className="ti ti-plug-connected" style={{color:"#6366f1",fontSize:20,flexShrink:0,marginTop:2}}/>
                <div>
                  <div style={{fontSize:13,fontWeight:700,color:"var(--color-text-primary)",marginBottom:3}}>API Configuration <span style={{fontSize:11,fontWeight:500,color:"#6366f1",background:"rgba(99,102,241,.1)",padding:"2px 8px",borderRadius:20,marginLeft:6}}>OPTIONAL</span></div>
                  <div style={{fontSize:12.5,color:"var(--color-text-secondary)",lineHeight:1.6}}>Enter your API details and they'll be wired directly into every generated prompt — base URLs, auth endpoints, request fields, and headers. <strong>Skip if you don't have this yet.</strong></div>
                </div>
              </div>

              <SH>Base API URL</SH>
              <div style={{display:"grid",gridTemplateColumns:"1fr 120px",gap:8,marginBottom:4}}>
                <div>
                  <label className="pf-label">Base Domain</label>
                  <input className="pf-input" value={cfg.apiConfig?.baseUrl||""} placeholder="https://api.yourapp.com" onChange={e=>setAC("baseUrl",e.target.value)}/>
                </div>
                <div>
                  <label className="pf-label">API Version</label>
                  <input className="pf-input" value={cfg.apiConfig?.apiVersion||""} placeholder="/v1" onChange={e=>setAC("apiVersion",e.target.value)}/>
                </div>
              </div>
              {cfg.apiConfig?.baseUrl&&<div style={{fontSize:11.5,color:"#6366f1",marginTop:4,marginBottom:16,fontFamily:"monospace",background:"rgba(99,102,241,.06)",padding:"5px 10px",borderRadius:6}}>
                Full base: {cfg.apiConfig.baseUrl}{cfg.apiConfig.apiVersion||""}
              </div>}

              <SH>Authentication Endpoint</SH>
              <div style={{display:"grid",gridTemplateColumns:"110px 1fr",gap:8,marginBottom:12}}>
                <div>
                  <label className="pf-label">Method</label>
                  <select className="pf-select" value={cfg.apiConfig?.authMethod||"POST"} onChange={e=>setAC("authMethod",e.target.value)}>
                    {HTTP_METHODS.map(m=><option key={m}>{m}</option>)}
                  </select>
                </div>
                <div>
                  <label className="pf-label">Endpoint Path</label>
                  <input className="pf-input" value={cfg.apiConfig?.authEndpoint||""} placeholder="/auth/login" onChange={e=>setAC("authEndpoint",e.target.value)}/>
                </div>
              </div>
              {cfg.apiConfig?.baseUrl&&cfg.apiConfig?.authEndpoint&&(
                <div style={{fontSize:11.5,fontFamily:"monospace",background:"rgba(99,102,241,.06)",padding:"5px 10px",borderRadius:6,color:"#6366f1",marginBottom:16}}>
                  {cfg.apiConfig.authMethod||"POST"} {cfg.apiConfig.baseUrl}{cfg.apiConfig.apiVersion||""}{cfg.apiConfig.authEndpoint}
                </div>
              )}

              <SH>Request Body Fields</SH>
              <FieldsEditor fields={cfg.apiConfig?.authFields||[]} onChange={v=>setAC("authFields",v)} placeholder="field name (e.g. email)"/>

              <SH>Response Fields</SH>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:4}}>
                <div>
                  <label className="pf-label">Token field name</label>
                  <input className="pf-input" value={cfg.apiConfig?.tokenField||""} placeholder="access_token" onChange={e=>setAC("tokenField",e.target.value)}/>
                </div>
                <div>
                  <label className="pf-label">User object field name</label>
                  <input className="pf-input" value={cfg.apiConfig?.userField||""} placeholder="user" onChange={e=>setAC("userField",e.target.value)}/>
                </div>
              </div>

              <SH>Auth Header Format</SH>
              <input className="pf-input" value={cfg.apiConfig?.authHeaderFormat||""} placeholder="Bearer {token}" onChange={e=>setAC("authHeaderFormat",e.target.value)} style={{marginBottom:4}}/>
              <div style={{fontSize:11,color:"var(--color-text-tertiary)",marginBottom:16}}>Use {"{token}"} as placeholder. Examples: Bearer {"{token}"}, Token {"{token}"}</div>

              <SH>Additional Endpoints (optional)</SH>
              <EndpointsEditor endpoints={cfg.apiConfig?.extraEndpoints||[]} onChange={v=>setAC("extraEndpoints",v)}/>

              <div style={{height:16}}/>
              <SH>Custom Request Headers (optional)</SH>
              <div>
                {(cfg.apiConfig?.customHeaders||[]).map((h,i)=>(
                  <div className="pf-field-row" key={i}>
                    <input className="pf-input" value={h.key} placeholder="Header name (e.g. X-App-Version)" onChange={e=>setAC("customHeaders",(cfg.apiConfig.customHeaders||[]).map((x,j)=>j===i?{...x,key:e.target.value}:x))} style={{fontSize:12}}/>
                    <input className="pf-input" value={h.value} placeholder="Value" onChange={e=>setAC("customHeaders",(cfg.apiConfig.customHeaders||[]).map((x,j)=>j===i?{...x,value:e.target.value}:x))} style={{fontSize:12}}/>
                    <button className="pf-icon-btn" onClick={()=>setAC("customHeaders",(cfg.apiConfig.customHeaders||[]).filter((_,j)=>j!==i))}><i className="ti ti-x" style={{fontSize:12}}/></button>
                  </div>
                ))}
                <button className="pf-add-btn" onClick={()=>setAC("customHeaders",[...(cfg.apiConfig.customHeaders||[]),{key:"",value:""}])}><i className="ti ti-plus" style={{fontSize:11}}/> Add Header</button>
              </div>
            </div>
          )}

          {/* STEP 5: DESIGN + INDUSTRY */}
          {step===5&&(<div>
            <SH>Industry / App domain</SH>
            <InfoBox type="pf-info-indigo"><i className="ti ti-building" style={{color:"#6366f1",fontSize:14,flexShrink:0,marginTop:1}}/><span>Your industry shapes naming conventions, suggested capabilities, and terminology in all generated prompts.</span></InfoBox>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:8}}>
              {INDUSTRIES.map(ind=>(
                <button key={ind.id} className={`pf-opt${cfg.industry===ind.id?" selected":""}`} onClick={()=>set("industry",ind.id)} style={{marginBottom:0}}>
                  <div style={{fontSize:22,flexShrink:0}}>{ind.icon}</div>
                  <div className="pf-opt-body">
                    <div className="pf-opt-name" style={{fontSize:13}}>{ind.id}</div>
                    <div className="pf-opt-desc" style={{fontSize:11}}>{ind.desc}</div>
                  </div>
                  <div className="pf-check">{cfg.industry===ind.id&&<i className="ti ti-check" style={{fontSize:11,color:"#fff"}}/>}</div>
                </button>
              ))}
            </div>

            <SH>UI visual style</SH>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:8}}>
              {UI_TYPES.map(ut=>(
                <button key={ut.id} className={`pf-opt${cfg.uiType===ut.id?" selected":""}`} onClick={()=>set("uiType",ut.id)} style={{marginBottom:0}}>
                  <div style={{fontSize:20,flexShrink:0}}>{ut.icon}</div>
                  <div className="pf-opt-body">
                    <div className="pf-opt-name" style={{fontSize:13}}>{ut.id}</div>
                    <div className="pf-opt-desc" style={{fontSize:11}}>{ut.desc}</div>
                  </div>
                  <div className="pf-check">{cfg.uiType===ut.id&&<i className="ti ti-check" style={{fontSize:11,color:"#fff"}}/>}</div>
                </button>
              ))}
            </div>

            <SH>UI design system</SH>
            {UI_OPTS.map(u=><OptCard key={u.id} id={u.id} label={u.id} desc={u.desc} active={cfg.uiDesign===u.id} recommended={isRec("uiDesign",u.id)} recReason={RECS.uiDesign[u.id]} onClick={()=>set("uiDesign",u.id)}/>)}
            <SH>Theme mode</SH>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {THEME_OPTS.map(t=><OptCard key={t.id} id={t.id} label={t.id} desc={t.desc} active={cfg.theme===t.id} recommended={isRec("theme",t.id)} recReason={RECS.theme[t.id]} onClick={()=>set("theme",t.id)}/>)}
            </div>
            <SH>Animation system</SH>
            {ANIM_OPTS.map(a=><OptCard key={a.id} id={a.id} label={a.id} desc={a.desc} active={cfg.animation===a.id} recommended={isRec("animation",a.id)} recReason={RECS.animation[a.id]} onClick={()=>set("animation",a.id)}/>)}
          </div>)}

          {/* STEP 6: BACKEND */}
          {step===6&&(<div>
            <SH>Backend services</SH>
            {BACKEND_SERVICES.map(b=>{const rec=isRec("backendServices",b.id);const sel=(cfg.backendServices||[]).includes(b.id);return(<OptCard key={b.id} id={b.id} label={b.id} desc={b.desc} multi active={sel} recommended={rec} recReason={RECS.backendServices[b.id]} onClick={()=>toggle("backendServices",b.id)}/>);})}
            <SH>{isFlutter?"Local database":"Database"}</SH>
            {isFlutter&&<InfoBox type="pf-info-indigo"><i className="ti ti-database" style={{color:"#6366f1",fontSize:14,flexShrink:0,marginTop:1}}/><span><strong>Isar & Isar Plus</strong> are the fastest Flutter-native NoSQL databases. Multi-isolate safe, full-text search, pure Dart runtime. Highly recommended for production Flutter apps.</span></InfoBox>}
            {getDBL().map(d=>{const rec=isRec("databases",d.id);const sel=(cfg.databases||[]).includes(d.id);return(<OptCard key={d.id} id={d.id} label={d.id} desc={d.desc} multi active={sel} recommended={rec} recReason={RECS.databases[d.id]} onClick={()=>toggle("databases",d.id)}/>);})}
          </div>)}

          {/* STEP 7: INTEGRATIONS */}
          {step===7&&(<div>
            <SH>Push notification provider</SH>
            {PUSH_PROVIDERS.map(p=>{const rec=isRec("pushProvider",p.id);return(<OptCard key={p.id} id={p.id} label={p.id} desc={p.desc} icon="ti-bell" active={cfg.pushProvider===p.id} recommended={rec} recReason={RECS.pushProvider[p.id]} onClick={()=>set("pushProvider",p.id)}/>);})}
            <SH>Dynamic links & deep linking</SH>
            {DYNAMIC_LINK_PROVIDERS.map(d=>{const rec=isRec("dynamicLinks",d.id);return(<OptCard key={d.id} id={d.id} label={d.id} desc={d.desc} icon="ti-link" active={cfg.dynamicLink===d.id} recommended={rec} recReason={RECS.dynamicLinks[d.id]} onClick={()=>set("dynamicLink",d.id)}/>);})}
            <SH>Analytics</SH>
            {ANALYTICS.map(a=><OptCard key={a.id} id={a.id} label={a.id} desc={a.desc} active={cfg.analytics===a.id} recommended={a.id==="Firebase Analytics"} recReason={a.id==="Firebase Analytics"?"Free, Google standard, best mobile support":null} onClick={()=>set("analytics",a.id)}/>)}
            <SH>Crash reporting</SH>
            {CRASH_TOOLS.map(c=><OptCard key={c.id} id={c.id} label={c.id} desc={c.desc} active={cfg.crashTool===c.id} recommended={c.id==="Firebase Crashlytics"} recReason={c.id==="Firebase Crashlytics"?"Free, real-time crash alerts, best mobile":null} onClick={()=>set("crashTool",c.id)}/>)}
          </div>)}

          {/* STEP 8: CAPABILITIES */}
          {step===8&&(<div>
            <SH>Authentication methods</SH>
            {AUTH_TYPES.map(a=>{const rec=isRec("authTypes",a.id);const sel=(cfg.authTypes||[]).includes(a.id);return(<OptCard key={a.id} id={a.id} label={a.id} desc={a.desc} multi active={sel} recommended={rec} recReason={RECS.authTypes[a.id]} onClick={()=>toggle("authTypes",a.id)}/>);})}
            <SH>Additional capabilities</SH>
            <div className="pf-pills">{CAPABILITIES.map(c=><button key={c.id} className={`pf-pill${(cfg.capabilities||[]).includes(c.id)?" selected":""}`} onClick={()=>toggle("capabilities",c.id)}><i className={`ti ${c.icon}`} style={{fontSize:12}}/>{c.id}</button>)}</div>
          </div>)}

          {/* STEP 9: WORKFLOW */}
          {step===9&&(<div>
            <SH>Testing strategy</SH>
            {TEST_OPTS.map(t=>{const rec=isRec("testing",t.id);const sel=(cfg.testing||[]).includes(t.id);return(<OptCard key={t.id} id={t.id} label={t.id} desc={t.desc} multi active={sel} recommended={rec} recReason={RECS.testing[t.id]} onClick={()=>toggle("testing",t.id)}/>);})}
            <SH>CI/CD pipeline</SH>
            {CICD_OPTS.map(c=>{const rec=isRec("cicd",c.id);const sel=(cfg.cicd||[]).includes(c.id);return(<OptCard key={c.id} id={c.id} label={c.id} desc={c.desc} multi active={sel} recommended={rec} recReason={RECS.cicd[c.id]} onClick={()=>toggle("cicd",c.id)}/>);})}
            <SH>Git strategy</SH>
            {GIT_OPTS.map(g=><OptCard key={g.id} id={g.id} label={g.id} desc={g.desc} active={cfg.gitStrategy===g.id} recommended={isRec("gitStrategy",g.id)} recReason={RECS.gitStrategy[g.id]} onClick={()=>set("gitStrategy",g.id)}/>)}
          </div>)}

          {/* STEP 10: RESULTS */}
          {step===10&&prompts&&(<div>
            {/* Summary */}
            <div className="pf-summary">
              <div style={{fontSize:10,fontWeight:700,color:"#818cf8",textTransform:"uppercase",letterSpacing:".1em",marginBottom:7}}>Your Stack</div>
              <div style={{fontSize:15,fontWeight:700,color:"#fff",marginBottom:10}}>{cfg.platform} App · {cfg.industry} · {cfg.framework} · {cfg.stateManagement}</div>
              <div>{[cfg.architecture,cfg.uiDesign,cfg.uiType,cfg.theme,cfg.pushProvider,cfg.dynamicLink,...(cfg.databases||[]).slice(0,2),...(cfg.capabilities||[]).slice(0,3)].filter(Boolean).map(t=><span key={t} className="pf-tag">{t}</span>)}
              {(cfg.capabilities||[]).length>3&&<span className="pf-tag">+{cfg.capabilities.length-3} more</span>}</div>
            </div>

            {/* Credit tip */}
            <InfoBox type="pf-warn">
              <i className="ti ti-coin" style={{color:"#d97706",fontSize:15,flexShrink:0,marginTop:1}}/>
              <div><strong style={{color:"#92400e",display:"block",marginBottom:2}}>Credit Optimization</strong><span style={{fontSize:12,color:"#b45309"}}>After Prompt #1, every future module needs only: <code style={{background:"#fef3c7",padding:"1px 6px",borderRadius:4,fontSize:10.5,fontFamily:"monospace"}}>Create [Module]. Follow project-rules/master-rules.md</code></span></div>
            </InfoBox>

            {/* COMBINED PROMPT BUTTON */}
            <button className={`pf-combined-btn${combinedCopied?" copied":""}`} onClick={handleCombinedCopy}>
              <i className={`ti ti-${combinedCopied?"check":"layers-intersect"}`} style={{fontSize:16}}/>
              {combinedCopied?"✅ Combined Prompt Copied!":"Copy All as Single Combined Prompt (for Antigravity / Plan-first AI tools)"}
            </button>
            {combinedCopied&&<InfoBox type="pf-info-indigo" style={{marginBottom:12}}><i className="ti ti-info-circle" style={{color:"#6366f1",fontSize:14,flexShrink:0}}/><span style={{fontSize:12}}>Paste into Antigravity or any plan-first AI tool. It will read the full spec, create a phase plan, then implement step by step. All {prompts.length} prompts are included in sequence.</span></InfoBox>}

            <div style={{fontSize:10.5,fontWeight:700,color:"var(--color-text-tertiary)",textTransform:"uppercase",letterSpacing:".09em",marginBottom:14}}>
              {prompts.length} individual prompts — execute in order, or use the combined prompt above
            </div>

            {/* Prompt Cards */}
            {prompts.map(p=>{
              const ts=TAG_STYLES[p.tag]||TAG_STYLES.VALIDATION;
              const isExp=expanded===p.id;
              const isCopied=copied===p.id;
              const isFailed=copied===`fail-${p.id}`;
              return(
                <div key={p.id} className={`pf-prompt-card${p.tag==="FOUNDATION"?" foundation":""}`}>
                  <div style={{display:"flex",alignItems:"flex-start",gap:12,marginBottom:12}}>
                    <div style={{width:40,height:40,borderRadius:10,flexShrink:0,background:ts.bg,border:`1.5px solid ${ts.border}`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:15,fontWeight:800,color:ts.color}}>
                      {p.id}
                    </div>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{marginBottom:5}}>
                        <span className="pf-ptag" style={{background:ts.bg,color:ts.color,border:`0.5px solid ${ts.border}`}}>{p.tag}</span>
                        <span style={{fontSize:10,color:"var(--color-text-tertiary)",marginLeft:8}}>{p.phase}</span>
                      </div>
                      <div style={{fontSize:14,fontWeight:700,color:"var(--color-text-primary)",marginBottom:3}}>{p.title}</div>
                      <div style={{fontSize:12,color:"var(--color-text-secondary)",lineHeight:1.55}}>{p.description}</div>
                    </div>
                  </div>
                  <InfoBox>
                    <i className="ti ti-package" style={{fontSize:12,color:"var(--color-text-tertiary)",flexShrink:0,marginTop:2}}/>
                    <span style={{fontSize:11.5}}><strong style={{color:"var(--color-text-primary)"}}>Generates: </strong>{p.expected}</span>
                  </InfoBox>
                  <div style={{display:"flex",gap:7,flexWrap:"wrap",marginTop:12}}>
                    <button className="pf-preview-btn" onClick={()=>setExpanded(isExp?null:p.id)}>
                      <i className={`ti ti-${isExp?"eye-off":"terminal-2"}`} style={{fontSize:12}}/>{isExp?"Hide":"Preview"}
                    </button>
                    <button className={`pf-copy-btn${isCopied?" copied":isFailed?" failed":""}`} onClick={()=>handleCopy(p.id,p.prompt)}>
                      <i className={`ti ti-${isCopied?"check":isFailed?"alert-triangle":"copy"}`} style={{fontSize:12}}/>
                      {isCopied?"Copied!":isFailed?"Try Ctrl+C":"Copy Prompt"}
                    </button>
                  </div>
                  {isExp&&(
                    <div className="pf-terminal">
                      <div className="pf-term-bar">
                        <div className="pf-dot" style={{background:"#ff5f57"}}/><div className="pf-dot" style={{background:"#febc2e"}}/><div className="pf-dot" style={{background:"#28c840"}}/>
                        <span className="pf-term-label">prompt #{p.id} — {p.phase}</span>
                      </div>
                      <div className="pf-term-body"><pre>{p.prompt}</pre></div>
                    </div>
                  )}
                </div>
              );
            })}

            <div style={{background:"var(--color-background-secondary)",border:"1.5px solid var(--color-border-tertiary)",borderRadius:14,padding:"20px 18px",textAlign:"center",marginTop:8}}>
              <div style={{fontSize:26,marginBottom:8}}>🚀</div>
              <div style={{fontSize:14,fontWeight:700,color:"var(--color-text-primary)",marginBottom:5}}>Ready to build</div>
              <div style={{fontSize:12.5,color:"var(--color-text-secondary)",lineHeight:1.6,marginBottom:14}}>
                Start with Prompt #1 in your AI coding tool.<br/>
                Review all generated files before Prompt #2.<br/>
                Create feature modules one at a time using the Repeatable Template prompt.
              </div>
              <button onClick={()=>{setStep(0);setPrompts(null);setCfg({apiConfig:{authFields:[{key:"email",type:"String",required:true},{key:"password",type:"String",required:true}],customHeaders:[],extraEndpoints:[],authMethod:"POST",authEndpoint:"/auth/login",apiVersion:"/v1",tokenField:"access_token",userField:"user",authHeaderFormat:"Bearer {token}"}});setExpanded(null);}} style={{padding:"9px 18px",borderRadius:9,border:"1.5px solid var(--color-border-secondary)",background:"var(--color-background-primary)",color:"var(--color-text-secondary)",cursor:"pointer",fontSize:13,fontFamily:"inherit",display:"inline-flex",alignItems:"center",gap:6}}>
                <i className="ti ti-refresh"/>New Project
              </button>
            </div>
          </div>)}

          {/* NAV */}
          {step<10&&(
            <div className="pf-nav">
              {step>0?<button className="pf-btn-back" onClick={()=>go(step-1)}><i className="ti ti-arrow-left" style={{fontSize:13}}/>Back</button>:<div/>}
              <div style={{display:"flex",gap:8}}>
                {step===4&&<button className="pf-btn-back" onClick={()=>go(5)} style={{color:"#6366f1",borderColor:"rgba(99,102,241,.3)"}}>Skip <i className="ti ti-arrow-right" style={{fontSize:12}}/></button>}
                {step<9?<button className="pf-btn-next" onClick={()=>go(step+1)} disabled={!canNext()}>Continue <i className="ti ti-arrow-right" style={{fontSize:13}}/></button>:<button className="pf-btn-generate" onClick={generate}><i className="ti ti-sparkles" style={{fontSize:14}}/>Generate Prompts</button>}
              </div>
            </div>
          )}
        </div>
      </div>
    </>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
